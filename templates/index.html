<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/index.css">
</head>
<body>

            <div class="hero-content">

                <div class="hero-text">
                    <div class="text-line text-gold">APRENDA</div>
