{% extends "base.html" %}

{% block title %}Jogo de Adição - Divermatica{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/jogo-adicao.css') }}">
<script src="{{ url_for('static', filename='js/dificuldade-por-ano.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/jogo-adicao.js') }}" defer></script>

<div class="jogo-page">
    <img src="{{ url_for('static', filename='images/icons/favo_de_baixo.png') }}" alt="favo" class="favobaixo">
    <img src="{{ url_for('static', filename='images/icons/favo_de_cima.png') }}" alt="favo" class="favocima">
    <img src="{{ url_for('static', filename='images/images-jogoadicao/mascote_abelha.png') }}" alt="Mascote Abelha" class="mascote_abelha">
    <div class="circle circle-left"></div>
    <div class="circle circle-bottom"></div>

    <div class="jogo-area">
        <h1 class="titulo-jogo">Arraste o número certo para completar a soma</h1>
        <div class="operacao">
            <span id="num1"></span> + <span id="num2"></span> = <div class="resposta-drop" id="dropzone">?</div>
        </div>
        
        <div class="numeros-container" id="numeros"></div>
        
        <div class="controles">
            <button id="novo-jogo">Novo Jogo</button>
            <div class="pontuacao">Pontuação: <span id="score">0</span></div>
        </div>
    </div>

    <div class="voltar-container">
        <a href="{{ url_for('jogos_index') }}" class="back-link">← Voltar</a>
    </div>
</div>
{% endblock %}
